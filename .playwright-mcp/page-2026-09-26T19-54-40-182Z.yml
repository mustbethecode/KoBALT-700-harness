          - link "Uncategorized" [ref=f8e50] [cursor=pointer]:
            - /url: https://mustbethecode.com/category/uncategorized/
        - generic [ref=f8e51]:
          - paragraph [ref=f8e52]: I recently started a project which benchmarks AI model’s Korean capabilities, hoping it can help which models to choose when doing Korean test.
          - paragraph [ref=f8e53]: And of course when I saw the release of the new models today I wanted to test them!
          - paragraph [ref=f8e54]: So how does the results look? Lets get straight to the point.
          - figure [ref=f8e55]:
            - img "Bencmark results of AI models" [ref=f8e56]
          - paragraph [ref=f8e57]: Opus 5.5 is the new leader by a tiny margin beating GPT-6 Astra. And GPT-6 Sol is basicly the same as 5.6 Sol. Lets dive deeper.
          - figure [ref=f8e58]:
            - table [ref=f8e59]:
              - rowgroup [ref=f8e60]:
                - row [ref=f8e61]:
                  - cell "Level" [ref=f8e62]
                  - cell "Opus 5.5" [ref=f8e63]
                  - cell "GPT-6 Sol" [ref=f8e64]
                - row [ref=f8e65]:
                  - cell "1" [ref=f8e66]
                  - cell "181/182" [ref=f8e67]
                  - cell "180/182" [ref=f8e68]
                - row [ref=f8e69]:
                  - cell "2" [ref=f8e70]
                  - cell "209/220" [ref=f8e71]
                  - cell "207/220" [ref=f8e72]
                - row [ref=f8e73]:
                  - cell "3" [ref=f8e74]
                  - cell "243/298" [ref=f8e75]
                  - cell "216/298" [ref=f8e76]
          - paragraph [ref=f8e77]: In level 1 and 2 both are basically equal. Level 3 made the difference. Opus was better at solving harder problems.
          - paragraph [ref=f8e78]: The ouput itself was also interesting. Opus outputed it’s thought process and Sol just outputed the answer.
          - paragraph [ref=f8e79]:
            - text: And Opus does burn a lot of tokens
            - img "😭" [ref=f8e80]
          - figure [ref=f8e81]:
            - table [ref=f8e82]:
              - rowgroup [ref=f8e83]:
                - row [ref=f8e84]:
                  - cell "Level" [ref=f8e85]
                  - cell "GPT-5.6 Sol" [ref=f8e86]
                  - cell "GPT-6 Sol" [ref=f8e87]
                - row [ref=f8e88]:
                  - cell "1" [ref=f8e89]
                  - cell "177/182" [ref=f8e90]
                  - cell "180/182" [ref=f8e91]
                - row [ref=f8e92]:
                  - cell "2" [ref=f8e93]
                  - cell "208/220" [ref=f8e94]
                  - cell "207/220" [ref=f8e95]
                - row [ref=f8e96]:
                  - cell "3" [ref=f8e97]
                  - cell "214/298" [ref=f8e98]
                  - cell "216/298" [ref=f8e99]
          - paragraph [ref=f8e100]: Compared with 5.6 there is basically no difference.
          - paragraph [ref=f8e101]: Token effeciency did improve though. Costed a bit less than 5.6 to run the benchmark.
          - heading "Final thoughts" [level=2] [ref=f8e102]
          - paragraph [ref=f8e103]: Frontier model’s Korean capabilities are improving fast. Might need to find a new benchmark soon!
