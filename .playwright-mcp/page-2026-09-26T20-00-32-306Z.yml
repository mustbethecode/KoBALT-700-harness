  - main [ref=f20e19]:
    - generic [ref=f20e20]:
      - heading "Overview" [level=1] [ref=f20e21]
      - paragraph [ref=f20e22]: "KoBALT-700 is a set of 700 expert-written Korean multiple-choice items across five linguistic domains (Syntax, Semantics, Pragmatics, Phonetics/Phonology, Morphology). This record reports our own evaluation runs against it: what was tested, how, and what came out."
      - paragraph [ref=f20e23]: 17 Sep 2026 – 22 Sep 2026 · 700 items per run · 17 configurations (12 provider-default).
      - complementary "Important caveat" [ref=f20e24]:
        - paragraph [ref=f20e25]:
          - strong [ref=f20e26]: One run per configuration.
          - text: Intervals describe item-level sampling uncertainty within these 700 items — not run-to-run repeatability, which was not measured.
      - region [ref=f20e27]:
        - heading "What the runs show" [level=2] [ref=f20e28]
        - list [ref=f20e29]:
          - listitem [ref=f20e30]:
            - text: The highest observed score is
            - strong [ref=f20e31]: claude-opus-5.5
            - text: at 90.4% (95% CI 88.0%–92.4%), 633 of 700. This is the highest in this set, not a state-of-the-art claim.
          - listitem [ref=f20e32]: "Difficulty separates the runs: on Level 3 (n=298), scores run from 11.7% (solar-mini4-preview) to 81.5% (claude-opus-5.5); every run scores lowest on Level 3."
          - listitem [ref=f20e33]:
            - text: "Reasoning matters more than the ranking suggests: switching gpt-5.6-luna:floor from provider-default reasoning to disabled changed accuracy from 73.3% to 49.6% (-23.7 points) on the same 700 items. See the paired comparison on the Results page."
            - 'link "Results: reasoning comparisons" [ref=f20e34] [cursor=pointer]':
              - /url: results.html#ablations
